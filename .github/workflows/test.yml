name: Test local release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fabguard
          POSTGRES_PASSWORD: fabguard
          POSTGRES_DB: fabguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fabguard -d fabguard_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      FABGUARD_TEST_POSTGRES_URL: postgresql://fabguard:fabguard@127.0.0.1:5432/fabguard_test
      FABGUARD_LLM_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run ruff check src tests app.py
      - run: uv run pytest -q
