[project]
name = "fabguard"
version = "0.1.0"
description = "FabGuard AI: bearing fault detection replay and investigation graph"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "fastapi",
    "uvicorn",
    "streamlit",
    "sqlalchemy",
    "psycopg[binary]",
    "pgvector",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "soundfile",
    "librosa",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabguard"]
